<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Stargazers log</h1>
      <p>A log of the repositories I've starred.</p>
      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Starred repositories</h2>
        <ul id="events" class="repository-list" aria-live="polite">
          <li>Loading repositories…</li>
        </ul>
      </section>
    </main>
  </body>
</html>
